  # post-db:
  #   image: mysql:8.0.44-debian
  #   container_name: post-db
  #   env_file:
  #     - path: ../env/post/post.db.env
  #   ports:
  #     - "33062:3306"
  #   volumes:
  #     - "post-db-data:/var/lib/mysql"
  #   healthcheck:
  #     test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
  #     interval: 20s
  #     timeout: 5s
