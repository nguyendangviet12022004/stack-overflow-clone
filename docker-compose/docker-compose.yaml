services:

  #mail stmp server --------------------------------------------
  mail-smtp:
    image: maildev/maildev
    container_name: mail-smtp
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - backend-network

  #rabbitmq
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - path: ../env/rabbitmq/rabbitmq.env
    networks:
      - backend-network

  #db --------------------------------------------------------
  user-db:
    image: mysql:8.0.44-debian
    container_name: user-db
    env_file:
      - path: ../env/user/user.db.env
    ports:
        - "33061:3306"
    volumes:
        - user-db-data:/var/lib/mysql
    networks:
      - backend-network

  post-db:
    image: mysql:8.0.44-debian
    container_name: post-db
    env_file:
      - path: ../env/post/post.db.env
    ports:
      - "33062:3306"
    volumes:
      - "post-db-data:/var/lib/mysql"
    networks:
      - backend-network

  #config server --------------------------------------
  config:
    build:
      context: ./../config
    container_name: config
    ports:
      - "8070:8070"
#volumes
volumes:
    user-db-data:
      driver: local
    post-db-data:
      driver: local

#networks
networks:
    backend-network:
      driver: bridge