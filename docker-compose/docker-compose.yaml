  #rabbitmq
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - path: ../env/rabbitmq/rabbitmq.env
    healthcheck:
      test: "rabbitmq-diagnostics -q ping"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  #db --------------------------------------------------------
  # user-db:
  #   image: mysql:8.0.44-debian
  #   container_name: user-db
  #   env_file:
