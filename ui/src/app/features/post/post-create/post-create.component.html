<div class="container mx-auto mt-10 max-w-2xl p-6 bg-white rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-6">Ask a Question</h2>
    <form [formGroup]="postForm" (ngSubmit)="onSubmit()">
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Title</label>
            <input formControlName="title" type="text"
                class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="e.g. How to center a div?">
        </div>

        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Content</label>
            <div id="editor" class="bg-white border rounded-lg h-64"></div>
            <input type="hidden" formControlName="content">
        </div>

        <div class="mb-6 relative">
            <label class="block text-gray-700 text-sm font-bold mb-2">Tags</label>
            <div
                class="flex flex-wrap gap-2 mb-2 p-2 border rounded-lg focus-within:ring-2 focus-within:ring-blue-500 bg-white">
                <span *ngFor="let tag of tags; let i = index"
                    class="bg-blue-100 text-blue-800 text-sm font-medium px-2.5 py-0.5 rounded flex items-center">
                    {{ tag }}
                    <button type="button" (click)="removeTag(i)"
                        class="ml-1 text-blue-600 hover:text-blue-800 focus:outline-none">
                        &times;
                    </button>
                </span>
                <input [formControl]="tagInput" type="text" class="flex-grow focus:outline-none min-w-[100px]"
                    placeholder="e.g. (java angular regex)"
                    (keydown.enter)="$event.preventDefault(); addTagFromInput()">
            </div>

            <ul *ngIf="suggestions.length > 0"
                class="absolute z-10 w-full bg-white border border-gray-300 rounded-lg shadow-lg mt-1 max-h-48 overflow-y-auto">
                <li *ngFor="let suggestion of suggestions" (click)="addTag(suggestion)"
                    class="px-4 py-2 hover:bg-gray-100 cursor-pointer">
                    {{ suggestion }}
                </li>
            </ul>
        </div>

        <button type="submit" [disabled]="postForm.invalid"
            class="bg-blue-500 text-white font-bold py-2 px-4 rounded hover:bg-blue-600 disabled:opacity-50">
            Post Your Question
        </button>
    </form>
</div>
