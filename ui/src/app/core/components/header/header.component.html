<nav class="bg-white border-b border-gray-100 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <a routerLink="/" class="flex-shrink-0 flex items-center group">
                    <svg class="h-8 w-8 text-orange-500 transform group-hover:rotate-12 transition-transform duration-200"
                        viewBox="0 0 120 120" fill="currentColor">
                        <path d="M84.4 93.8V70.6h7.7v30.9H22.6V70.6h7.7v23.2H84.4z" />
                        <path
                            d="M38.8 68.4l37.8 7.9 1.6-7.6-37.8-7.9-1.6 7.6zm5-18l35 15.3 3.1-7.1-35-15.3-3.1 7.1zm8.5-17.2l29.7 24.7 4.9-5.9-29.7-24.7-4.9 5.9zm13.1-14.8l22.4 31.5 6.3-4.5-22.4-31.5-6.3 4.5zM31 82.1h38.6v-7.7H31v7.7z" />
                    </svg>
                    <span
                        class="ml-2 text-xl font-bold text-gray-900 group-hover:text-blue-600 transition-colors duration-200">
                        stack<span class="font-light">overflow</span>
                    </span>
                </a>
                <div class="hidden sm:ml-8 sm:flex sm:space-x-8">
                    <a routerLink="/" routerLinkActive="text-orange-600 border-orange-500"
                        [routerLinkActiveOptions]="{exact: true}"
                        class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300">
                        Questions
                    </a>
                    <a *ngIf="authService.isLoggedIn()" routerLink="/favorites"
                        routerLinkActive="text-orange-600 border-orange-500"
                        class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300">
                        Favorites
                    </a>
                    <a routerLink="/posts/new" routerLinkActive="text-orange-600 border-orange-500"
                        class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300">
                        Ask Question
                    </a>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-2xl px-8 hidden md:flex items-center">
                <div class="relative w-full">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </span>
                    <input type="text" [(ngModel)]="searchQuery" (keyup.enter)="onSearch()"
                        class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md leading-5 bg-white placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition duration-150 shadow-sm"
                        placeholder="Search for questions, titles or content...">
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <ng-container *ngIf="!authService.isLoggedIn()">
                    <a routerLink="/login"
                        class="text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md text-sm font-medium">Log in</a>
                    <a routerLink="/register"
                        class="bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150">Sign
                        up</a>
                </ng-container>
                <ng-container *ngIf="authService.isLoggedIn()">
                    <div class="flex items-center space-x-4">
                        <!-- Notification Dropdown -->
                        <div class="relative">
                            <button (click)="toggleNotifications()"
                                class="p-2 text-gray-400 hover:text-gray-500 rounded-full hover:bg-gray-100 focus:outline-none transition-all duration-200">
                                <span class="sr-only">View notifications</span>
                                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                                </svg>
                                <span *ngIf="(notificationService.unreadCount$ | async) !== 0"
                                    class="absolute top-1.5 right-1.5 block h-4 w-4 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center ring-2 ring-white">
                                    {{ notificationService.unreadCount$ | async }}
                                </span>
                            </button>

                            <!-- Notification Menu -->
                            <div *ngIf="showNotifications" (click)="$event.stopPropagation()"
                                class="origin-top-right absolute right-0 mt-2 w-80 rounded-xl shadow-2xl bg-white ring-1 ring-black ring-opacity-5 focus:outline-none overflow-hidden z-50 transition-all duration-300">
                                <div
                                    class="px-4 py-3 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                                    <h3 class="text-sm font-semibold text-gray-900">Notifications</h3>
                                    <span class="text-xs text-gray-500">{{ (notificationService.notifications$ |
                                        async)?.length }} items</span>
                                </div>
                                <div class="max-h-96 overflow-y-auto">
                                    <ng-container *ngIf="(notificationService.notifications$ | async) as notifications">
                                        <div *ngIf="notifications.length === 0" class="px-4 py-12 text-center">
                                            <p class="text-sm text-gray-500">No notifications yet</p>
                                        </div>
                                        <div *ngFor="let notification of notifications"
                                            [class.bg-blue-50]="!notification.isRead"
                                            class="px-4 py-4 hover:bg-gray-50 transition-colors duration-150 border-b border-gray-50 last:border-0 group relative">
                                            <div class="flex items-start space-x-3">
                                                <div class="flex-shrink-0 mt-1">
                                                    <div [ngClass]="{
                                                        'bg-orange-100 text-orange-600': notification.type === 'LIKE',
                                                        'bg-blue-100 text-blue-600': notification.type === 'COMMENT',
                                                        'bg-green-100 text-green-600': notification.type === 'REPLY'
                                                    }" class="h-8 w-8 rounded-full flex items-center justify-center">
                                                        <svg *ngIf="notification.type === 'LIKE'" class="h-4 w-4"
                                                            fill="currentColor" viewBox="0 0 20 20">
                                                            <path
                                                                d="M2 10.5a1.5 1.5 0 113 0v6a1.5 1.5 0 01-3 0v-6zM6 10.333v5.43a2 2 0 011.106 1.79l.05.05A4 4 0 0011 18h1a1 1 0 001-1v-4a1 1 0 00-1-1H9a.5.5 0 01-.5-.5V5.707l.146-.147 3-3V2.5a.5.5 0 01.18-.382l4-3.5a.5.5 0 01.767.583A2 2 0 0117 2.5V3h2.5a2.5 2.5 0 012.5 2.5v9a2.5 2.5 0 01-2.5 2.5H19c-.3 0-.582-.053-.846-.15a3.991 3.991 0 00-1.154.65H11a5.992 5.992 0 01-4-1.417" />
                                                        </svg>
                                                        <svg *ngIf="notification.type === 'COMMENT' || notification.type === 'REPLY'"
                                                            class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
                                                            <path fill-rule="evenodd"
                                                                d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z"
                                                                clip-rule="evenodd" />
                                                        </svg>
                                                    </div>
                                                </div>
                                                <div class="flex-1 min-w-0">
                                                    <p class="text-sm text-gray-900 leading-snug">
                                                        {{ notification.message }}
                                                    </p>
                                                    <p class="text-xs text-gray-500 mt-1">
                                                        {{ notification.createdAt | date:'shortTime' }}
                                                    </p>
                                                </div>
                                                <button *ngIf="!notification.isRead"
                                                    (click)="markAsRead(notification.id, $event)"
                                                    class="flex-shrink-0 flex items-center justify-center h-2 w-2 rounded-full bg-blue-600 hover:scale-125 transition-transform duration-150"
                                                    title="Mark as read">
                                                </button>
                                            </div>
                                            <a [routerLink]="['/posts', notification.postId]"
                                                (click)="showNotifications = false" class="absolute inset-0"></a>
                                        </div>
                                    </ng-container>
                                </div>
                                <div class="px-4 py-2 bg-gray-50 border-t border-gray-100 text-center">
                                    <button class="text-xs font-medium text-blue-600 hover:text-blue-700">View all
                                        notifications</button>
                                </div>
                            </div>
                        </div>

                        <span class="text-sm text-gray-600 hidden md:block">Welcome back!</span>
                        <button (click)="authService.logout()"
                            class="text-gray-500 hover:text-red-600 px-3 py-2 rounded-md text-sm font-medium transition duration-150 border border-gray-200 hover:border-red-200 hover:bg-red-50">
                            Log out
                        </button>
                    </div>
                </ng-container>
            </div>
        </div>
    </div>
</nav>
